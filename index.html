<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Restaurant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { line-height: 1.6; background-color: #f4f4f4; }
        header { background: #8B0000; color: white; padding: 15px; text-align: center; }
        nav { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=80') center/cover;
            height: 400px; display: flex; align-items: center; justify-content: center; color: white; text-align: center;
        }
        .hero h1 { font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); }
        section { padding: 40px 20px; text-align: center; }
        .menu { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .menu-item { background: white; border: 1px solid #ddd; padding: 20px; width: 250px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        form { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #8B0000; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%; }
        footer { background: #222; color: white; text-align: center; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h2>Royal Restaurant</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<div class="hero" id="home">
    <h1>Welcome to Royal Restaurant</h1>
</div>

<section id="menu">
    <h2>Our Special Menu</h2>
    <div class="menu">
        <div class="menu-item">
            <h3>Paneer Tikka</h3>
            <p>₹250</p>
        </div>
        <div class="menu-item">
            <h3>Veg Biryani</h3>
            <p>₹200</p>
        </div>
        <div class="menu-item">
            <h3>Chinese Noodles</h3>
            <p>₹180</p>
        </div>
    </div>
</section>

<section id="contact">
    <h2>Contact Us</h2>
    <form onsubmit="return submitForm()">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Message" rows="4"></textarea>
        <button type="submit">Send Message</button>
    </form>
</section>

<footer>
    © 2026 Royal Spice Restaurant <br>
    Designed by Priyanka Panchal | Web Designer (Fresher)
</footer>

<script>
    function submitForm(){
        alert("Thank you! Your message has been sent.");
        return false;
    }
</script>

</body>
</html>
